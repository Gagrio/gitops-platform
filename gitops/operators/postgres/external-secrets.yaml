---
# ExternalSecret — pulls the superuser password from GCP Secret Manager
# and creates a Kubernetes Secret that CNPG references for the superuser credential
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pg-superuser-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-superuser-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-superuser-password"
---
# ExternalSecret — pulls the app user password from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pg-app-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-app-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-app-password"
---
# ExternalSecret — pulls the replication user password from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pg-replication-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-replication-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: streaming_replica
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-replication-password"
