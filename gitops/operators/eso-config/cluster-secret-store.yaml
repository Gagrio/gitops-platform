---
# ClusterSecretStore — connects ESO to GCP Secret Manager.
# Auth uses the GCE metadata server (node SA has roles/secretmanager.secretAccessor).
# Applied only after ESO is installed (eso-config kustomization depends on common).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: "${GCP_PROJECT_ID}"
