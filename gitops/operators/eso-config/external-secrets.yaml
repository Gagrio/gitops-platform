---
# Grafana admin password — used by kube-prometheus-stack HelmRelease via valuesFrom
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-grafana-admin-password"
---
# Postgres superuser password — used by CNPG Cluster CR
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-superuser-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-superuser-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-superuser-password"
---
# Postgres app user password — used by CNPG Cluster bootstrap initdb
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-app-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-app-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-app-password"
---
# Postgres replication password — used by CNPG high-availability replication slots
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-replication-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: pg-replication-password
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: streaming_replica
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-pg-replication-password"
