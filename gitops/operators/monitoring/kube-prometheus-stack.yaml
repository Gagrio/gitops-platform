---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=57.0.0 <70.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  valuesFrom:
    - kind: Secret
      name: grafana-admin-password
      valuesKey: password
      targetPath: grafana.adminPassword
  values:
    grafana:
      persistence:
        enabled: false
      ingress:
        enabled: true
        ingressClassName: nginx
        path: /grafana
        pathType: Prefix
      grafana.ini:
        server:
          root_url: "%(protocol)s://%(domain)s/grafana"
          serve_from_sub_path: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          # CloudNativePG dashboard — ID from grafana.com
          cloudnativepg:
            gnetId: 20417
            revision: 1
            datasource: Prometheus
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            memory: 512Mi
        # Watch all PodMonitors and ServiceMonitors across all namespaces.
        # NilUsesHelmValues must be false — otherwise an empty selector falls back to
        # matching only monitors labelled release=kube-prometheus-stack, which excludes
        # the PodMonitor CNPG creates in the postgres namespace.
        podMonitorNamespaceSelector: {}
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
    alertmanager:
      enabled: false
