---
# Flux Kustomization — reconciles all cluster-wide controllers (ingress, monitoring, ESO).
# Points at the same shared base as dev; environment-specific values come from
# cluster-global and cluster-vars ConfigMaps created by the Ansible bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-global
      - kind: ConfigMap
        name: cluster-vars
