---
# CloudNativePG operator — manages the PostgreSQL cluster lifecycle
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnativepg
  namespace: postgres
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: ">=0.20.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnativepg
        namespace: flux-system
      interval: 24h
  values:
    monitoring:
      podMonitorEnabled: true
