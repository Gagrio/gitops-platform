---
# ESO HelmRelease only — ClusterSecretStore and ExternalSecrets live in the
# eso-config kustomization which depends on this one, ensuring CRDs exist first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 24h
  values:
    webhook:
      replicaCount: 1
    certController:
      replicaCount: 1
