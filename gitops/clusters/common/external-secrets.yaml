---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 24h
  values:
    webhook:
      replicaCount: 1
    certController:
      replicaCount: 1
---
# ClusterSecretStore — reads from GCP Secret Manager.
# Auth is omitted: ESO pods use the GCE metadata server to get credentials from
# the node service account (created by the IAM Terraform module), which has
# roles/secretmanager.secretAccessor bound at project level.
# ${GCP_PROJECT_ID} is substituted by Flux from the cluster-vars ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: "${GCP_PROJECT_ID}"
