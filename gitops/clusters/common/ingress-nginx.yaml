---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: ">=4.9.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 24h
  values:
    controller:
      replicaCount: 2
      # hostPort binds the controller pods directly to ports 80/443 on the node.
      # Required because ServiceLB is disabled in k3s and no cloud LB is provisioned.
      # The GCP firewall allows 80/443 from 0.0.0.0/0 so any node IP works.
      hostPort:
        enabled: true
      service:
        type: LoadBalancer
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
