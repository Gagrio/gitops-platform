---
# ExternalSecret — pulls the Grafana admin password from GCP Secret Manager
# and creates a Kubernetes Secret that the kube-prometheus-stack HelmRelease references
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: "${ENVIRONMENT}-grafana-admin-password"
