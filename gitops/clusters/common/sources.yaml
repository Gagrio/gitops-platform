---
# HelmRepository sources for all charts used in this cluster.
# Each entry registers a Helm repo — chart names are referenced by HelmRelease resources.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx      # chart: ingress-nginx  (used in ingress-nginx.yaml)
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets   # chart: external-secrets  (used in external-secrets.yaml)
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community   # chart: kube-prometheus-stack  (used in kube-prometheus-stack.yaml)
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnativepg      # chart: cloudnative-pg  (used in operators/postgres/cloudnativepg.yaml)
  namespace: flux-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
