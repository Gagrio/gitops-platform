---
# Flux Kustomization — reconciles CloudNativePG operator and the HA Postgres cluster.
# Depends on infrastructure so ESO and the ClusterSecretStore are ready first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/operators/postgres
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: common
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-global
      - kind: ConfigMap
        name: cluster-vars
