---
# Flux Kustomization — reconciles the demo application (Adminer).
# Depends on postgres so the database cluster is ready before the app starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/applications/demo-app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: postgres
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-global
      - kind: ConfigMap
        name: cluster-vars
