---
# Flux Kustomization — reconciles all cluster-wide controllers (ingress, monitoring, ESO).
# ${GCP_PROJECT_ID} and ${ENVIRONMENT} are substituted from the cluster-vars ConfigMap,
# which the Ansible bootstrap playbook creates in the flux-system namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
