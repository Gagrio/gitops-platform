---
# Flux Kustomization — reconciles shared cluster platform components (ingress, monitoring, ESO).
# Manifests live in clusters/common/ and are shared across all environments;
# environment-specific values are injected via cluster-global and cluster-vars ConfigMaps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/clusters/common
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-global
      - kind: ConfigMap
        name: cluster-vars
