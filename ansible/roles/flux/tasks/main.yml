---
- name: Download Flux CLI
  ansible.builtin.get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_amd64.tar.gz"
    dest: /tmp/flux.tar.gz
    mode: "0644"

- name: Extract Flux CLI
  ansible.builtin.unarchive:
    src: /tmp/flux.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - flux

- name: Make Flux CLI executable
  ansible.builtin.file:
    path: /usr/local/bin/flux
    mode: "0755"

- name: Wait for k3s API server to be reachable
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

- name: Wait for all nodes to be Ready
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} wait node --all \
      --for=condition=Ready --timeout=120s
  changed_when: false

- name: Check if Flux is already bootstrapped
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubeconfig_path }}
      - get
      - namespace
      - "{{ flux_namespace }}"
  register: flux_ns_check
  failed_when: false
  changed_when: false

- name: Bootstrap Flux (first run)
  ansible.builtin.command:
    argv:
      - flux
      - bootstrap
      - github
      - --kubeconfig={{ kubeconfig_path }}
      - --owner={{ github_owner }}
      - --repository={{ github_repo }}
      - --branch={{ gitops_branch }}
      - --path={{ gitops_path }}
      - --personal
      - --token-auth
  environment:
    GITHUB_TOKEN: "{{ github_token }}"
    KUBECONFIG: "{{ kubeconfig_path }}"
  when: flux_ns_check.rc != 0

- name: Ensure flux-system namespace exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubeconfig_path }}
      - get
      - namespace
      - "{{ flux_namespace }}"
  changed_when: false

# cluster-global — GCP_PROJECT_ID; shared across all environments in the same project
- name: Create cluster-global ConfigMap for Flux substitution
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-global
      namespace: {{ flux_namespace }}
    data:
      GCP_PROJECT_ID: "{{ gcp_project_id }}"
    EOF

# cluster-vars — per-environment values; REGION can differ across environments
- name: Create cluster-vars ConfigMap for Flux substitution
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-vars
      namespace: {{ flux_namespace }}
    data:
      ENVIRONMENT: "{{ cluster_env }}"
      REGION: "{{ region }}"
      STORAGE_CLASS: "{{ storage_class }}"
    EOF

# Patch CoreDNS to resolve metadata.google.internal → 169.254.169.254
# Required for barman-cloud (Python) to authenticate via the GCE metadata server from inside pods.
# Flannel pods can reach 169.254.169.254 directly but CoreDNS has no entry for the hostname.
- name: Add metadata.google.internal to CoreDNS NodeHosts
  ansible.builtin.shell: |
    CM=$(kubectl --kubeconfig={{ kubeconfig_path }} get configmap coredns -n kube-system -o json)
    if echo "$CM" | grep -q 'metadata.google.internal'; then
      echo "already present, skipping"
      exit 0
    fi
    echo "$CM" | python3 -c "
import sys, json
cm = json.load(sys.stdin)
cm['data']['NodeHosts'] = cm['data']['NodeHosts'].rstrip() + '\n169.254.169.254 metadata.google.internal\n'
print(json.dumps(cm))
" | kubectl --kubeconfig={{ kubeconfig_path }} apply -f -
  changed_when: true

- name: Ensure kubeconfig is world-readable for scp fetch
  ansible.builtin.file:
    path: "{{ kubeconfig_path }}"
    mode: "0644"
