---
flux_version: "2.8.6"
flux_namespace: flux-system
github_owner: Gagrio
github_repo: gitops-platform
kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Injected by CI via --extra-vars
gcp_project_id: ""
cluster_env: dev
# Injected by CI: main for dev cluster, prod for prod cluster
gitops_branch: main
# Each environment has its own Flux entry point in the gitops/ tree
gitops_path: "gitops/clusters/{{ cluster_env }}"
# Kubeconfig artifact path includes environment name for clarity
kubeconfig_artifact_path: "/tmp/kubeconfig-gitops-{{ cluster_env }}"

# Region defaults to europe-west1; can be overridden per environment via --extra-vars
# if dev and prod need to run in different regions
region: europe-west1
# dev: local-path (k3s default, local disk — not durable across node deletion)
# prod: standard  (GCE Persistent Disk via CSI driver — survives node deletion)
storage_class: local-path
