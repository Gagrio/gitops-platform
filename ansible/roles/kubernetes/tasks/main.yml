---
- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false

- name: Install k3s control plane
  when: k3s_role == "control"
  block:
    - name: Run k3s installer (control plane)
      when: >
        k3s_installed_version.rc != 0 or
        k3s_version not in k3s_installed_version.stdout
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          sh -s - server {{ k3s_server_args }}

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Get internal IP from GCE metadata server
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/ip
        headers:
          Metadata-Flavor: Google
        return_content: true
      register: gce_internal_ip

    - name: Share token and internal control plane URL with all hosts
      ansible.builtin.set_fact:
        k3s_token: "{{ node_token_raw.content | b64decode | trim }}"
        k3s_url: "https://{{ gce_internal_ip.content }}:6443"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['k3s_cluster'] }}"

    - name: Ensure k3s is enabled and started
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

- name: Install k3s worker
  when: k3s_role == "worker"
  block:
    - name: Run k3s installer (worker)
      when: >
        k3s_installed_version.rc != 0 or
        k3s_version not in k3s_installed_version.stdout
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          K3S_URL={{ k3s_url }} \
          K3S_TOKEN={{ k3s_token }} \
          sh -s - agent

    - name: Ensure k3s-agent is enabled and started
      ansible.builtin.service:
        name: k3s-agent
        enabled: true
        state: started
