---
- name: Install k3s control plane
  when: k3s_role == "control"
  block:
    - name: Run k3s installer (control plane)
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          sh -s - server {{ k3s_server_args }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Set token fact for workers
      ansible.builtin.set_fact:
        k3s_token: "{{ node_token_raw.content | b64decode | trim }}"
        k3s_url: "https://{{ ansible_default_ipv4.address }}:6443"
      delegate_to: localhost
      delegate_facts: false

    - name: Share token with all hosts
      ansible.builtin.set_fact:
        k3s_token: "{{ node_token_raw.content | b64decode | trim }}"
        k3s_url: "https://{{ ansible_default_ipv4.address }}:6443"
      delegate_to: "{{ item }}"
      loop: "{{ groups['k3s_cluster'] }}"

    - name: Ensure k3s is enabled and started
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

- name: Install k3s worker
  when: k3s_role == "worker"
  block:
    - name: Run k3s installer (worker)
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          K3S_URL={{ k3s_url }} \
          K3S_TOKEN={{ k3s_token }} \
          sh -s - agent
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure k3s-agent is enabled and started
      ansible.builtin.service:
        name: k3s-agent
        enabled: true
        state: started
