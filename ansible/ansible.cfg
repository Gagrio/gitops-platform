[defaults]
inventory          = inventory/gcp_compute.yaml
remote_user        = ubuntu
private_key_file   = ~/.ssh/gitops-ci
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
roles_path         = roles

[ssh_connection]
pipelining         = True
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
