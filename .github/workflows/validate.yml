---
# Runs on every PR that touches Terraform, Ansible, or GitOps manifests.
# Validates without making any changes — safe to run on untrusted PRs.
name: Validate

on:
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - "gitops/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write  # required for WIF authentication to GCP

jobs:
  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform fmt check
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=environments/dev"

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="admin_cidr=${{ secrets.ADMIN_CIDR }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -no-color
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint==24.2.3

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint playbooks/bootstrap.yml

  manifests-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate gitops manifests
        run: |
          find gitops -name "*.yaml" | xargs kubeconform \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -skip Kustomization,HelmRelease,HelmRepository,GitRepository,ExternalSecret,ClusterSecretStore,Cluster \
            -summary
