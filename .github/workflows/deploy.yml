---
# Triggered by push to main (→ dev) or prod (→ prod).
# The target environment is derived from the branch name — no manual selection needed.
# Application changes go through Flux — no CI job needed for those.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      gitops_branch:
        description: "Git branch Flux should track (defaults to environment name)"
        required: false
        default: ""
  push:
    branches:
      - main   # deploys to dev
      - prod   # deploys to prod
    paths:
      - "terraform/**"
      - "ansible/**"
      - "gitops/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

# Reusable GCP auth block referenced by all jobs
jobs:

  # ── Terraform ──────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      subnet_cidr: ${{ steps.tf-outputs.outputs.subnet_cidr }}
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'dev' || github.ref_name }}
    env:
      ENVIRONMENT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'dev' || github.ref_name }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=environments/${{ env.ENVIRONMENT }}"

      - name: Terraform apply
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: echo "subnet_cidr=$(terraform output -raw subnet_cidr)" >> "$GITHUB_OUTPUT"

  # ── Ansible ────────────────────────────────────────────────────────────────
  ansible-bootstrap:
    name: Ansible Bootstrap
    runs-on: ubuntu-latest
    needs: terraform-apply
    permissions:
      contents: write   # Flux bootstrap pushes flux-system manifests to the repo
      id-token: write
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'dev' || github.ref_name }}
    env:
      ENVIRONMENT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'dev' || github.ref_name }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Ansible
        run: |
          pip install ansible==9.4.0 google-auth requests
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/gitops-ci
          chmod 600 ~/.ssh/gitops-ci

      - name: Wait for SSH on all nodes
        run: bash scripts/ci/wait-for-ssh.sh

      - name: Generate Ansible inventory
        run: bash scripts/ci/generate-inventory.sh

      - name: Run bootstrap playbook
        working-directory: ansible
        env:
          PYTHONUNBUFFERED: "1"
          STORAGE_CLASS: local-path
        run: |
          ansible-playbook playbooks/bootstrap.yml \
            -i /tmp/hosts.ini \
            --extra-vars "gcp_project_id=${{ secrets.GCP_PROJECT_ID }} \
                          region=${{ secrets.GCP_REGION }} \
                          cluster_env=${{ env.ENVIRONMENT }} \
                          gitops_branch=${{ github.event_name == 'workflow_dispatch' && (inputs.gitops_branch != '' && inputs.gitops_branch || inputs.environment) || github.ref_name }} \
                          github_owner=${{ github.repository_owner }} \
                          subnet_cidr=${{ needs.terraform-apply.outputs.subnet_cidr }} \
                          storage_class=${{ env.STORAGE_CLASS }} \
                          github_token=${{ secrets.FLUX_GITHUB_TOKEN }}"

      - name: Fetch kubeconfig from control plane
        run: bash scripts/ci/fetch-kubeconfig.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kubeconfig-gitops-${{ env.ENVIRONMENT }}
          path: /tmp/kubeconfig-gitops-${{ env.ENVIRONMENT }}
          retention-days: 7
