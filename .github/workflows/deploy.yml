---
# Runs on every merge to main that touches Terraform or Ansible.
# Applies infrastructure changes and bootstraps the cluster.
# Application changes go through Flux — no CI job needed for those.
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "ansible/**"

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=environments/dev"

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

  ansible-bootstrap:
    name: Ansible Bootstrap
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment: dev
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}    # read by gcp_compute inventory plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Ansible
        run: |
          pip install ansible==9.4.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/enclaive-ci
          chmod 600 ~/.ssh/enclaive-ci

      - name: Wait for SSH to be available on all nodes
        run: |
          for ip in $(gcloud compute instances list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --filter="labels.environment=dev" \
            --format="get(networkInterfaces[0].accessConfigs[0].natIP)"); do
            echo "Waiting for SSH on $ip..."
            timeout 120 bash -c "until ssh -o StrictHostKeyChecking=no -i ~/.ssh/enclaive-ci ubuntu@$ip 'echo ok' 2>/dev/null; do sleep 5; done"
          done

      - name: Run bootstrap playbook
        working-directory: ansible
        run: |
          ansible-playbook playbooks/bootstrap.yml \
            --extra-vars "gcp_project_id=${{ secrets.GCP_PROJECT_ID }} region=${{ secrets.GCP_REGION }} environment=dev subnet_cidr=${{ secrets.SUBNET_CIDR }} storage_class=local-path github_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig-enclaive-dev
          path: /tmp/kubeconfig-enclaive-dev
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: ansible-bootstrap
    environment: dev
    steps:
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/enclaive-ci
          chmod 600 ~/.ssh/enclaive-ci

      - name: Get control plane IP
        id: cp-ip
        run: |
          CP_IP=$(gcloud compute instances list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --filter="labels.environment=dev AND labels.role=control" \
            --format="get(networkInterfaces[0].accessConfigs[0].natIP)")
          echo "ip=$CP_IP" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests on control plane
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/enclaive-ci \
            ubuntu@${{ steps.cp-ip.outputs.ip }} bash << 'REMOTE'
            set -e
            K="sudo k3s kubectl"

            echo "=== Nodes ==="
            $K wait node --all --for=condition=Ready --timeout=120s

            echo "=== Waiting for Flux kustomizations to appear ==="
            timeout 120 bash -c \
              'until sudo k3s kubectl get kustomization common -n flux-system &>/dev/null; do sleep 5; done'

            echo "=== Flux kustomizations Ready ==="
            $K wait kustomization/common kustomization/postgres kustomization/demo-app \
              -n flux-system --for=condition=Ready --timeout=600s

            echo "=== Waiting for Postgres Cluster CR ==="
            timeout 60 bash -c \
              'until sudo k3s kubectl get cluster pg -n postgres &>/dev/null; do sleep 5; done'
            $K wait cluster/pg -n postgres --for=condition=Ready --timeout=300s

            echo "=== Postgres pods ==="
            $K wait pods -n postgres -l cnpg.io/cluster=pg \
              --for=condition=Ready --timeout=120s

            echo "=== Adminer pod ==="
            $K wait pods -n demo-app -l app=adminer \
              --for=condition=Ready --timeout=120s

            echo ""
            echo "✅ All smoke tests passed!"
          REMOTE
